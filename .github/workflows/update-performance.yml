name: Update performance data

on:
  schedule:
    # Runs every 2 hours. IBKR's daily NAV report is only daily-
    # granularity, so most of these runs will find nothing new and
    # skip the commit - this just means new data shows up within 2
    # hours of IBKR posting it, rather than waiting for the next
    # monthly run.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch performance data from IBKR
        env:
          FLEX_TOKEN: ${{ secrets.FLEX_TOKEN }}
          FLEX_QUERY_ID: ${{ secrets.FLEX_QUERY_ID }}
        run: python scripts/fetch_performance.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update performance data ($(date -u +%Y-%m-%d %H:%M UTC))"
          git push
